[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoai"
version = "0.2.0"
description = "基于 CAA (Activation Additions) 的 AI 情绪调控框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "psutil>=5.0",
    "accelerate",
]

[tool.setuptools.packages.find]
include = ["emoai*"]

[tool.setuptools.package-data]
"emoai" = ["py.typed"]
